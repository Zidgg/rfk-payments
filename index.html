<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kape't Bahay sa RFK — Scan to Pay</title>
  <meta name="description" content="Scan to pay your order at Kape't Bahay sa RFK.">
  <link rel="icon" href="assets/cafe-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header class="badge-row">
      <span class="badge">
        <img src="assets/tapcard-logo.png" alt="Tap Card" class="badge__mark">
        <span class="badge__text">Powered by Tap Card</span>
      </span>
    </header>

    <main class="hero">
      <img src="assets/cafe-logo.jpg" alt="Kape't Bahay sa RFK logo" class="hero__logo">
      <p class="hero__eyebrow">Kape&rsquo;t Bahay sa RFK</p>
    </main>

    <section class="receipt" aria-label="Payment QR code">
      <h1 class="receipt__title">Scan to pay</h1>

      <div class="receipt__qr-frame">
        <img src="assets/qr-payment.png" alt="GCash QR code to pay Kape't Bahay sa RFK" class="receipt__qr">
      </div>

      <div class="receipt__divider" role="presentation"></div>

      <p class="receipt__instructions">
        Open your GCash app, then scan the code above to complete your payment.
      </p>
      <p class="receipt__note">
        Show your payment confirmation to the counter once done.
      </p>
    </section>

    <footer class="footer">
      <p>Thank you for supporting Kape&rsquo;t Bahay sa RFK.</p>
    </footer>

  </div>

</body>
</html>
